# Configuration Streamlit pour LibraRecipes Android
# Générée automatiquement selon l'environnement

[server]
headless = false
port = 8501
address = "127.0.0.1"
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
maxMessageSize = 200
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[global]
developmentMode = false
suppressDeprecationWarnings = true

[theme]
base = "dark"
primaryColor = "#FF6B6B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"
