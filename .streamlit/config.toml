# Configuration Streamlit pour LibraRecipes Android
# Générée automatiquement selon l'environnement

[server]
headless = false
port = 8501
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
maxMessageSize = 200
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"
serverPort = 8501

[client]
caching = true
displayEnabled = true
showErrorDetails = true

[global]
developmentMode = true
suppressDeprecationWarnings = false
disableWatchdogWarning = false

[theme]
base = "light"
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[logger]
level = "DEBUG"
enableLogging = true

[deprecation]
showPyplotGlobalUse = false
showfileUploaderEncoding = false
