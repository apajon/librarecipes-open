plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
}

android {
    namespace = "com.apajon.librarecipes"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.apajon.librarecipes"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "2.3.18"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

kapt {
    correctErrorTypes = true
    useBuildCache = true
    
    javacOptions {
        // These options can help with annotation processing issues
        option("-Adagger.fastInit=enabled")
        option("-Adagger.hilt.android.internal.disableAndroidSuperclassValidation=true")
        
        // Room specific options for better null safety
        option("-Aroom.schemaLocation", "$projectDir/schemas")
        option("-Aroom.incremental", "true")
        option("-Aroom.expandProjection", "true")
        
        // General Java compiler options for better error handling
        option("-source", "8")
        option("-target", "8")
        option("-Xlint:all")
        option("-Xlint:-processing")
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    
    // Material Components for XML themes
    implementation "com.google.android.material:material:1.11.0"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.6"
    
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    
    // Hilt for dependency injection
    implementation "com.google.dagger:hilt-android:2.48"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"
    kapt "com.google.dagger:hilt-compiler:2.48"
    
    // Retrofit for API calls (kept for future sync feature)
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    
    // Room database
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // Image loading
    implementation "io.coil-kt:coil-compose:2.5.0"
    
    // DataStore Preferences for persisting user settings
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Activity Result Contracts for photo picking
    implementation "androidx.activity:activity-ktx:1.8.2"
    
    // ExifInterface for photo metadata
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    
    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.02.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}