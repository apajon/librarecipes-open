- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace # Supprime les espaces en fin de ligne
  - id: end-of-file-fixer # Ajoute une ligne vide à la fin des fichiers
  - id: check-yaml # Vérifie la syntaxe des fichiers YAML

- repo: https://github.com/psf/black
  rev: 25.1.0
  hooks:
  - id: black
    args: [ "--line-length=119", "--exclude=my_robot_package/" ]

- repo: https://github.com/PyCQA/flake8
  rev: 7.2.0
  hooks:
  - id: flake8
    args: [ "--max-line-length=119", "--exclude=my_robot_package/", "--ignore", "E203,W503,E501" ]

