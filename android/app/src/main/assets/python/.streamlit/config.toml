[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[logger]
level = "info"

[client]
showErrorDetails = true

[runner]
magicEnabled = false

[theme]
primaryColor = "#4CAF50"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#212121"
