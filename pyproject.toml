[project]
name = "librarecipes"
version = "2.9.2"
description = ""
authors = [
    {name = "Adrien PAJON",email = "adrien.pajon@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit (>=1.46.1,<2.0.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "streamlit-tags (>=1.2.8,<2.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "tomli (>=2.2.1,<3.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pathlib2 (>=2.3.7.post1,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)"
]


[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
mypy = "^1.16.1"
pyright = "^1.1.402"
pylint = "^3.3.7"
pydocstyle = "^6.3.0"
pre-commit = "^4.2.0"
pytest = "^8.4.1"
pytest-stub = "^1.1.0"
autopep8 = "^2.3.2"
bump2version = "^1.0.1"
pytest-mock = "^3.14.1"
pytest-cov = "^6.2.1"
pytest-benchmark = "^5.1.0"
memory-profiler = "^0.61.0"
selenium = "^4.34.2"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.15"
mkdocs-mermaid2-plugin = "^1.2.1"
pytest-html = "^4.1.1"
pytest-timeout = "^2.4.0"
responses = "^0.25.7"


[tool.poetry.group.android.dependencies]
python-dotenv = "^1.1.1"
mkdocs-material = "^9.6.15"
typing-extensions = "^4.14.1"
pathvalidate = "^3.3.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
