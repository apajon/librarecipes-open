name: Backend CI

on:
  push:
    branches: [ main, feature/android-migration ]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Create data directory
      run: mkdir -p data

    - name: Initialize database
      run: |
        export PYTHONPATH=.
        poetry run python scripts/init_db.py

    - name: Run tests
      run: |
        export PYTHONPATH=.
        poetry run pytest tests/ -v --tb=short

    - name: Run linting
      run: |
        poetry run flake8 src backend --max-line-length=120 --extend-ignore=E203,W503

    - name: Type checking
      run: |
        poetry run mypy src backend --ignore-missing-imports

  api-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Create data directory
      run: mkdir -p data

    - name: Initialize database
      run: |
        export PYTHONPATH=.
        poetry run python scripts/init_db.py

    - name: Start API server
      run: |
        export PYTHONPATH=.
        poetry run python -m backend.main &
        sleep 10

    - name: Test API endpoints
      run: |
        curl -f http://localhost:8000/ || exit 1
        curl -f http://localhost:8000/health || exit 1
        curl -f http://localhost:8000/metadata/ingredients || exit 1
        curl -f http://localhost:8000/metadata/categories || exit 1
        curl -f http://localhost:8000/metadata/tags || exit 1