name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Configure git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Bump version
      id: bump
      run: |
        poetry run bump2version ${{ github.event.inputs.version_type }}
        NEW_TAG=$(git describe --tags --abbrev=0)
        echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
        git push origin HEAD --tags

  build-backend:
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Run tests
      run: |
        export PYTHONPATH=.
        mkdir -p data
        poetry run python scripts/init_db.py
        poetry run pytest tests/ -v

    - name: Build package
      run: poetry build

    - name: Upload backend artifacts
      uses: actions/upload-artifact@v3
      with:
        name: backend-dist
        path: dist/

  build-android:
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Grant execute permission for gradlew
      run: chmod +x android_app/gradlew

    - name: Build release APK
      working-directory: android_app
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android_app/app/build/outputs/apk/release/

  create-release:
    needs: [build-backend, build-android]
    if: always() && needs.build-backend.result == 'success' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: ./dist

    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./android-release

    - name: Get tag name
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "tag_name=${{ needs.bump-version.outputs.new_tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        release_name: LibraRecipes ${{ steps.get_tag.outputs.tag_name }}
        draft: false
        prerelease: false
        body: |
          ## LibraRecipes Release ${{ steps.get_tag.outputs.tag_name }}
          
          ### Changes in this release:
          - Backend FastAPI migration
          - Native Android app with Jetpack Compose
          - Modern CI/CD pipeline
          
          ### Downloads:
          - **Android APK**: See assets below
          - **Backend Python package**: Available in artifacts
          
          ### Installation:
          1. Install the Android APK on your device
          2. Run the backend API server using Poetry
          3. Configure the Android app to connect to your API server

    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./android-release/app-release.apk
        asset_name: LibraRecipes-${{ steps.get_tag.outputs.tag_name }}.apk
        asset_content_type: application/vnd.android.package-archive